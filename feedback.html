    <main class="container">

        <section class="hero-section">
    <div class="hero-content">

    <h1>We Value Your Feedback</h1>
    <div class="hero-description">
        <p>Your feedback would really be appreciated! Please fill out the form so that we can know how you feel about us</p>
    </div>
    <form id="feedbackForm" action="https://formspree.io/f/mykopana" method="POST">    
        <div class="feedback-form container">

            <div class="input-group">
                <label>Name</label> 
            <input type="text" name="name" placeholder="Enter Your Name">
            </div>
            
            <div class="input-group">
                <label>Rating (1-5 stars)</label>

                 <select name="rating" id="rating" required>
          <option value="5">★★★★★ (5 - Amazing)</option>
          <option value="4">★★★★☆ (4 - Great)</option>
          <option value="3">★★★☆☆ (3 - Good)</option>
          <option value="2">★★☆☆☆ (2 - Fair)</option>
          <option value="1">★☆☆☆☆ (1 - Needs improvement)</option>
          </select>

          </div>

          <div class="input-group">

            <label>What do you have to say about us?</label>

            <input type="text" name="improved" placeholder="Share your thoughts about our products...">
          </div>

          <div class="submit container">

            <button type="submit" class="btn-gold submit-btn">Submit</button>

            </div>
            </form>    


        </main>

        <p>&copy; 2026 Kaia's Beauty Parlour. All rights reserved.</p>

    </footer>

    <div id="thankYouPopup" class="popup">
        <div class="popup-content">
            <h2>Thank You For Your Feedback!</h2>
            <button id="closePopup">Close</button>
        </div>
    </div>
